[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SpokenTOD"
version = "0.1.0"
description = "A large-scale spoken task-oriented dialogue (TOD) dataset"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Junseong Pyo", email = "standardstar@hanyang.ac.kr"}
]
dependencies = [
    "absl-py>=0.7.0",
    "click>=8.0.0",
    "fuzzywuzzy>=0.17.0",
    "litellm>=1.79.0",
    "loguru>=0.7.0",
    "numpy>=1.16.1",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.0.0",
    "rich>=13.0.0",
    "scikit-learn>=1.0.0",
    "six>=1.12.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
local-synthesis = [
    "qwen-tts>=0.1.1",
    "soundfile>=0.12",
    "torch>=2.6,<2.7",
    "torchaudio>=2.6,<2.7",
]

normalization = ["nemo-text-processing==1.1.0"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
